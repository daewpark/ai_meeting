    <!-- PWA: 앱 설치(이름/아이콘/독립창)를 위한 매니페스트 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cc785c">
    <style>
        :root {
            --primary: #cc785c;
            --primary-active: #a9583e;
            --primary-disabled: #e6dfd8;
            --warn: #b58a2e;
            --canvas: #faf9f5;
            --surface-card: #efe9de;
            --surface-dark: #181715;
            --hairline: #e6dfd8;
            --ink: #141413;
            --muted: #6c6a64;
            --on-primary: #ffffff;
            --on-dark: #faf9f5;
            --font-serif: "Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--canvas);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
            background-color: var(--canvas);
        }

        /* 좌측 상단 타이틀: 텍스트 대신 "D." 아이콘 + "AI Minutes" 워드마크를 벡터(SVG)로 표시.
           텍스트를 <path> 윤곽선으로 구워넣었기 때문에 폰트 설치 여부와 무관하게 항상 동일하게 보입니다. */
        h1.brand-logo {
            display: flex;
            align-items: center;
        }
        h1.brand-logo svg {
            display: block;
            height: 68px;
            width: auto;
        }
        
        .status-badge {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink);
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--muted); }
        .recording .dot { background-color: var(--primary); animation: pulse 1.5s infinite; }
        .recording.status-badge {
            background-color: var(--canvas);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 음성인식 서버 연결이 끊겨 자동으로 재연결을 시도하는 동안 표시하는 상태.
           "녹음 중"과는 다른 색(amber)으로 구분해서, 지금 실제로 인식 중이 아니라
           재연결 시도 중이라는 걸 눈치챌 수 있게 합니다. */
        .reconnecting .dot { background-color: var(--warn); animation: pulse-warn 1.2s infinite; }
        .reconnecting.status-badge {
            background-color: var(--canvas);
            border-color: var(--warn);
            color: var(--warn);
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(204, 120, 92, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0); }
        }

        @keyframes pulse-warn {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(181, 138, 46, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(181, 138, 46, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(181, 138, 46, 0); }
        }

        main {
            flex: 1;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            overflow-y: auto;
        }

        /* flex-wrap: 좁은 사이드바 폭에서 회의 구분 배지 등이 추가되어도 버튼이 화면 밖으로
           밀려나지 않고 다음 줄로 자연스럽게 넘어가도록 합니다. */
        .controls { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
        
        /* 언어 선택 드롭다운 스타일 */
        .lang-select {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            padding: 0 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            outline: none;
            cursor: pointer;
            height: 40px;
        }
        .lang-select:hover { background-color: var(--surface-card); }

        button {
            flex: 1;
            padding: 10px 14px;
            height: 40px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary { background-color: var(--primary); color: var(--on-primary); }
        .btn-primary:hover { background-color: var(--primary-active); }
        
        .btn-dark { background-color: var(--surface-dark); color: var(--on-dark); }
        .btn-dark:hover { background-color: #252320; }

        .btn-secondary { background-color: var(--canvas); border: 1px solid var(--hairline); color: var(--ink); }
        .btn-secondary:hover { background-color: var(--surface-card); }
        
        .hidden { display: none !important; }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .card-header {
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--hairline);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .small-btn { 
            background-color: var(--canvas); 
            border: 1px solid var(--hairline); 
            color: var(--ink); 
            font-size: 13px; 
            font-weight: 500;
            padding: 4px 12px; 
            height: auto;
            border-radius: var(--radius-sm); 
            flex: 0; 
            white-space: nowrap;
        }
        .small-btn:hover { background-color: var(--surface-card); }

        textarea {
            flex: 1;
            width: 100%;
            padding: var(--space-md);
            border: none;
            background-color: transparent;
            resize: none;
            outline: none;
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--ink);
            font-size: 14px;
        }
        textarea::placeholder { color: var(--muted); }

        .keywords {
            padding: var(--space-sm) var(--space-md);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--hairline);
            background-color: var(--canvas);
            min-height: 50px;
            align-items: center;
        }

        .keyword {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            color: var(--ink);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }
        
        .empty-text { color: var(--muted); font-size: 13px; margin: auto; }

        /* ===== 회의 구분(업무회의/면접) 선택 시 면접 정보 배지 ===== */
        .interview-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            color: var(--ink);
            padding: 0 12px;
            height: 40px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            max-width: 100%;
        }
        /* 지원자명/포지션이 길어져도 배지가 줄바꿈 대상 버튼들을 밀어내지 않도록,
           텍스트 부분만 말줄임표로 축약합니다. */
        .interview-badge span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .interview-badge button {
            flex: 0 0 auto;
            height: auto;
            padding: 2px 8px;
            font-size: 12px;
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            color: var(--ink);
            border-radius: var(--radius-sm);
        }
        .interview-badge button:hover { background-color: var(--surface-dark); color: var(--on-dark); }

        /* ===== 면접 정보(지원자명/포지션) 입력 팝업 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(20, 20, 19, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            width: 320px;
            max-width: calc(100vw - 48px);
            box-shadow: 0 12px 32px rgba(20, 20, 19, 0.18);
        }
        .modal-card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .modal-card p.modal-desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: var(--space-md);
        }
        .modal-field { margin-bottom: var(--space-sm); }
        .modal-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--ink);
        }
        .modal-field input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--ink);
            background-color: var(--surface-card);
            outline: none;
        }
        .modal-field input:focus { border-color: var(--primary); }
        .modal-actions {
            display: flex;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }
    </style>
</head>

        </h1>
        <div id="statusBadge" class="status-badge">
            <div class="dot"></div>
            <span id="statusText">대기 중</span>
        </div>
    </header>

    <main>
        <div class="controls">
            <!-- 언어 선택 드롭다운 -->
            <select id="langSelect" class="lang-select">
                <option value="ko-KR">🇰🇷 한국어</option>
                <option value="en-US">🇺🇸 English</option>
                <option value="zh-CN">🇨🇳 中文</option>
            </select>
            <!-- 회의 구분(업무회의/면접) 선택. "면접"을 고르면 지원자명/포지션 입력 팝업이 뜹니다. -->
            <select id="meetingTypeSelect" class="lang-select">
                <option value="business" selected>📋 업무회의</option>
                <option value="interview">🎙️ 면접</option>
            </select>
            <!-- 면접 정보가 입력되면 여기에 배지로 표시되고, "수정"으로 다시 팝업을 열 수 있습니다. -->
            <div id="interviewBadge" class="interview-badge hidden">
                <span id="interviewBadgeText"></span>
                <button id="interviewEditBtn" type="button">수정</button>
            </div>
            <button id="startBtn" class="btn-primary">녹음 시작</button>
            <button id="stopBtn" class="btn-dark hidden">녹음 중지</button>
            <button id="clearBtn" class="btn-secondary">초기화</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span>전체 내용</span>
                <div style="display:flex; gap: 8px;">
                    <button id="copyBtn" class="small-btn">복사</button>
                    <button id="downloadBtn" class="small-btn">저장</button>
                    <button id="notionBtn" class="small-btn">AI 요약 → Notion</button>
                </div>
            </div>
            <textarea id="transcript" placeholder="버튼을 누르고 말을 시작하세요..." readonly></textarea>
            <div class="keywords" id="keywordList">
                <span class="empty-text">자주 언급된 단어가 여기에 나타납니다.</span>
            </div>
        </div>
    </main>

    <!-- 면접 정보(지원자명/포지션) 입력 팝업. 회의 구분에서 "면접"을 선택하면 표시됩니다. -->
    <div id="interviewModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>면접 정보 입력</h2>
            <p class="modal-desc">AI 요약과 Notion 제목·파일명에 사용됩니다.</p>
            <div class="modal-field">
                <label for="interviewCandidateInput">지원자명</label>
                <input type="text" id="interviewCandidateInput" placeholder="예: 홍길동">
            </div>
            <div class="modal-field">
                <label for="interviewPositionInput">지원 포지션</label>
                <input type="text" id="interviewPositionInput" placeholder="예: 백엔드 개발자">
            </div>
            <div class="modal-actions">
                <button id="interviewCancelBtn" type="button" class="btn-secondary">취소</button>
                <button id="interviewConfirmBtn" type="button" class="btn-primary">확인</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
