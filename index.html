<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사이드바 회의록</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iI2ZhZjlmNSIvPjxwYXRoIGQ9Ik03IDloMThhMiAyIDAgMCAxIDIgMnY5YTIgMiAwIDAgMS0yIDJIMTRsLTUgNHYtNEg3YTIgMiAwIDAgMS0yLTJ2LTlhMiAyIDAgMCAxIDItMnoiIGZpbGw9IiNjYzc4NWMiLz48bGluZSB4MT0iMTAiIHkxPSIxNSIgeDI9IjEwIiB5Mj0iMTciIHN0cm9rZT0iI2ZhZjlmNSIgc3Ryb2tlLXdpZHRoPSIxLjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxsaW5lIHgxPSIxMy41IiB5MT0iMTMiIHgyPSIxMy41IiB5Mj0iMTkiIHN0cm9rZT0iI2ZhZjlmNSIgc3Ryb2tlLXdpZHRoPSIxLjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxsaW5lIHgxPSIxNyIgeTE9IjE0LjUiIHgyPSIxNyIgeTI9IjE3LjUiIHN0cm9rZT0iI2ZhZjlmNSIgc3Ryb2tlLXdpZHRoPSIxLjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxsaW5lIHgxPSIyMC41IiB5MT0iMTMiIHgyPSIyMC41IiB5Mj0iMTkiIHN0cm9rZT0iI2ZhZjlmNSIgc3Ryb2tlLXdpZHRoPSIxLjgiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxsaW5lIHgxPSIyNCIgeTE9IjE1IiB4Mj0iMjQiIHkyPSIxNyIgc3Ryb2tlPSIjZmFmOWY1IiBzdHJva2Utd2lkdGg9IjEuOCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PC9zdmc+Cg==">
    <!-- PWA: 앱 설치(이름/아이콘/독립창)를 위한 매니페스트 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#cc785c">
    <style>
        :root {
            --primary: #cc785c;
            --primary-active: #a9583e;
            --primary-disabled: #e6dfd8;
            --warn: #b58a2e;
            --canvas: #faf9f5;
            --surface-card: #efe9de;
            --surface-dark: #181715;
            --hairline: #e6dfd8;
            --ink: #141413;
            --muted: #6c6a64;
            --on-primary: #ffffff;
            --on-dark: #faf9f5;
            --font-serif: "Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--canvas);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
            background-color: var(--canvas);
        }

        h1 { 
            font-family: var(--font-serif);
            font-size: 1.5rem; 
            font-weight: 400; 
            letter-spacing: -0.5px;
            color: var(--ink);
        }
        
        .status-badge {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink);
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--muted); }
        .recording .dot { background-color: var(--primary); animation: pulse 1.5s infinite; }
        .recording.status-badge {
            background-color: var(--canvas);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 음성인식 서버 연결이 끊겨 자동으로 재연결을 시도하는 동안 표시하는 상태.
           "녹음 중"과는 다른 색(amber)으로 구분해서, 지금 실제로 인식 중이 아니라
           재연결 시도 중이라는 걸 눈치챌 수 있게 합니다. */
        .reconnecting .dot { background-color: var(--warn); animation: pulse-warn 1.2s infinite; }
        .reconnecting.status-badge {
            background-color: var(--canvas);
            border-color: var(--warn);
            color: var(--warn);
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(204, 120, 92, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0); }
        }

        @keyframes pulse-warn {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(181, 138, 46, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(181, 138, 46, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(181, 138, 46, 0); }
        }

        main {
            flex: 1;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            overflow-y: auto;
        }

        .controls { display: flex; gap: var(--space-sm); }
        
        /* 언어 선택 드롭다운 스타일 */
        .lang-select {
            background-color: var(--canvas);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-md);
            padding: 0 10px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            outline: none;
            cursor: pointer;
            height: 40px;
        }
        .lang-select:hover { background-color: var(--surface-card); }

        button {
            flex: 1;
            padding: 10px 14px;
            height: 40px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary); color: var(--on-primary); }
        .btn-primary:hover { background-color: var(--primary-active); }
        
        .btn-dark { background-color: var(--surface-dark); color: var(--on-dark); }
        .btn-dark:hover { background-color: #252320; }

        .btn-secondary { background-color: var(--canvas); border: 1px solid var(--hairline); color: var(--ink); }
        .btn-secondary:hover { background-color: var(--surface-card); }
        
        .hidden { display: none !important; }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .card-header {
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--hairline);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .small-btn { 
            background-color: var(--canvas); 
            border: 1px solid var(--hairline); 
            color: var(--ink); 
            font-size: 13px; 
            font-weight: 500;
            padding: 4px 12px; 
            height: auto;
            border-radius: var(--radius-sm); 
            flex: 0; 
            white-space: nowrap;
        }
        .small-btn:hover { background-color: var(--surface-card); }

        textarea {
            flex: 1;
            width: 100%;
            padding: var(--space-md);
            border: none;
            background-color: transparent;
            resize: none;
            outline: none;
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--ink);
            font-size: 14px;
        }
        textarea::placeholder { color: var(--muted); }

        .keywords {
            padding: var(--space-sm) var(--space-md);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--hairline);
            background-color: var(--canvas);
            min-height: 50px;
            align-items: center;
        }

        .keyword {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            color: var(--ink);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }
        
        .empty-text { color: var(--muted); font-size: 13px; margin: auto; }
    </style>
</head>
<body>
    <header>
        <h1>회의록</h1>
        <div id="statusBadge" class="status-badge">
            <div class="dot"></div>
            <span id="statusText">대기 중</span>
        </div>
    </header>

    <main>
        <div class="controls">
            <!-- 언어 선택 드롭다운 추가 -->
            <select id="langSelect" class="lang-select">
                <option value="ko-KR">🇰🇷 한국어</option>
                <option value="en-US">🇺🇸 English</option>
                <option value="zh-CN">🇨🇳 中文</option>
            </select>
            <button id="startBtn" class="btn-primary">녹음 시작</button>
            <button id="stopBtn" class="btn-dark hidden">녹음 중지</button>
            <button id="clearBtn" class="btn-secondary">초기화</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span>전체 내용</span>
                <div style="display:flex; gap: 8px;">
                    <button id="copyBtn" class="small-btn">복사</button>
                    <button id="downloadBtn" class="small-btn">저장</button>
                    <button id="notionBtn" class="small-btn">AI 요약 → Notion</button>
                </div>
            </div>
            <textarea id="transcript" placeholder="버튼을 누르고 말을 시작하세요..." readonly></textarea>
            <div class="keywords" id="keywordList">
                <span class="empty-text">자주 언급된 단어가 여기에 나타납니다.</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
