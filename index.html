<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회의록</title>
    <style>
        :root {
            /* Colors - Brand & Accent */
            --primary: #cc785c;          /* Coral */
            --primary-active: #a9583e;
            --primary-disabled: #e6dfd8;
            
            /* Colors - Surface */
            --canvas: #faf9f5;           /* Tinted cream canvas */
            --surface-card: #efe9de;     /* Light cream feature cards */
            --surface-dark: #181715;     /* Dark navy */
            --hairline: #e6dfd8;         /* 1px border tone */
            
            /* Colors - Text */
            --ink: #141413;              /* Warm dark */
            --muted: #6c6a64;
            --on-primary: #ffffff;
            --on-dark: #faf9f5;

            /* Typography (보안 정책을 위해 로컬 시스템 폰트 활용) */
            --font-serif: "Cormorant Garamond", "EB Garamond", Garamond, "Times New Roman", serif;
            --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            
            /* Shapes & Radius */
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;
            
            /* Spacing (사이드바 환경에 맞춰 축소 적용) */
            --space-xs: 8px;
            --space-sm: 12px;
            --space-md: 16px;
            --space-lg: 24px;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-sans);
            background-color: var(--canvas);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--hairline);
            flex-shrink: 0;
            background-color: var(--canvas);
        }

        h1 { 
            font-family: var(--font-serif);
            font-size: 1.5rem; 
            font-weight: 400; 
            letter-spacing: -0.5px; /* 세리프 폰트의 핵심 네거티브 자간 */
            color: var(--ink);
        }
        
        .status-badge {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--ink);
        }

        .dot { width: 6px; height: 6px; border-radius: 50%; background-color: var(--muted); }
        .recording .dot { background-color: var(--primary); animation: pulse 1.5s infinite; }
        .recording.status-badge { 
            background-color: var(--canvas); 
            border-color: var(--primary); 
            color: var(--primary); 
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 4px rgba(204, 120, 92, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(204, 120, 92, 0); }
        }

        main {
            flex: 1;
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            overflow-y: auto;
        }

        .controls { display: flex; gap: var(--space-sm); }
        
        button {
            flex: 1;
            padding: 10px 14px;
            height: 40px;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-sans);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Coral Primary CTA */
        .btn-primary { 
            background-color: var(--primary); 
            color: var(--on-primary); 
        }
        .btn-primary:hover { background-color: var(--primary-active); }
        
        /* Dark Surface Button (for stop) */
        .btn-dark {
            background-color: var(--surface-dark);
            color: var(--on-dark);
        }
        .btn-dark:hover { background-color: #252320; }

        /* Secondary Cream Button */
        .btn-secondary { 
            background-color: var(--canvas); 
            border: 1px solid var(--hairline); 
            color: var(--ink); 
        }
        .btn-secondary:hover { background-color: var(--surface-card); }
        
        .hidden { display: none !important; }

        .card {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            /* 그림자 없이 플랫한 디자인 유지 */
        }

        .card-header {
            padding: var(--space-sm) var(--space-md);
            border-bottom: 1px solid var(--hairline);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }

        .small-btn { 
            background-color: var(--canvas); 
            border: 1px solid var(--hairline); 
            color: var(--ink); 
            font-size: 13px; 
            font-weight: 500;
            padding: 4px 12px; 
            height: auto;
            border-radius: var(--radius-sm); 
            flex: 0; 
            white-space: nowrap;
        }
        .small-btn:hover { background-color: var(--surface-card); }

        textarea {
            flex: 1;
            width: 100%;
            padding: var(--space-md);
            border: none;
            background-color: transparent;
            resize: none;
            outline: none;
            font-family: var(--font-sans);
            line-height: 1.6;
            color: var(--ink);
            font-size: 14px;
        }

        textarea::placeholder { color: var(--muted); }

        .keywords {
            padding: var(--space-sm) var(--space-md);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            border-top: 1px solid var(--hairline);
            background-color: var(--canvas);
            min-height: 50px;
            align-items: center;
        }

        .keyword {
            background-color: var(--surface-card);
            border: 1px solid var(--hairline);
            color: var(--ink);
            padding: 4px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0;
        }
        
        .empty-text {
            color: var(--muted);
            font-size: 13px;
            margin: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>회의록</h1>
        <div id="statusBadge" class="status-badge">
            <div class="dot"></div>
            <span id="statusText">대기 중</span>
        </div>
    </header>

    <main>
        <div class="controls">
            <!-- 디자인 시스템에 맞춰 코랄색(Primary)과 네이비(Dark) 버튼 활용 -->
            <button id="startBtn" class="btn-primary">녹음 시작</button>
            <button id="stopBtn" class="btn-dark hidden">녹음 중지</button>
            <button id="clearBtn" class="btn-secondary">초기화</button>
        </div>

        <div class="card">
            <div class="card-header">
                <span>전체 내용</span>
                <div style="display:flex; gap: 8px;">
                    <button id="copyBtn" class="small-btn">복사</button>
                    <button id="downloadBtn" class="small-btn">저장</button>
                </div>
            </div>
            
            <textarea id="transcript" placeholder="버튼을 누르고 말을 시작하세요..." readonly></textarea>
            
            <div class="keywords" id="keywordList">
                <span class="empty-text">자주 언급된 단어가 여기에 나타납니다.</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
